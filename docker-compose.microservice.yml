# SGU Tour — Full Microservice Docker Compose (9 Isolated MySQL DBs + 12 Services + Frontend)
# Usage:
#   docker compose -f docker-compose.microservice.yml --env-file .env.microservice up -d --build
# With n8n mail workflow:
#   docker compose -f docker-compose.microservice.yml --env-file .env.microservice --profile mail up -d --build

name: sgu-live

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-common: &service-common
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *logging
  networks:
    - sgu-network

services:
  rabbitmq-volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-ec", "if [ ! -e /var/lib/rabbitmq/.volume-initialized ]; then chown -R 100:101 /var/lib/rabbitmq; touch /var/lib/rabbitmq/.volume-initialized; chown 100:101 /var/lib/rabbitmq/.volume-initialized; fi"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: "no"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  # ============================================================
  # MESSAGE BROKER & CACHE & SEARCH
  # ============================================================
  rabbitmq:
    <<: *service-common
    depends_on:
      rabbitmq-volume-init:
        condition: service_completed_successfully
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sgu_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: sgu_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-common
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  elasticsearch:
    <<: *service-common
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # 9 ISOLATED MYSQL 8.4 DATABASES
  # ============================================================
  mysql-auth:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=80", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_AUTH_PASSWORD:?MYSQL_ROOT_AUTH_PASSWORD is required}
      MYSQL_DATABASE: sgu_auth
      MYSQL_USER: sgu_auth
      MYSQL_PASSWORD: ${MYSQL_AUTH_PASSWORD:?MYSQL_AUTH_PASSWORD is required}
    volumes:
      - mysql_auth_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_auth.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data_seed/migrations/V010__tour_guide_role.sql:/docker-entrypoint-initdb.d/10_tour_guide_role.sql:ro
      - ./data_seed/migrations/V011__tour_guide_permission.sql:/docker-entrypoint-initdb.d/11_tour_guide_permission.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_auth -Dsgu_auth -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='users'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-tour:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=80", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_TOUR_PASSWORD:?MYSQL_ROOT_TOUR_PASSWORD is required}
      MYSQL_DATABASE: sgu_tour
      MYSQL_USER: sgu_tour
      MYSQL_PASSWORD: ${MYSQL_TOUR_PASSWORD:?MYSQL_TOUR_PASSWORD is required}
    volumes:
      - mysql_tour_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_tour.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data_seed/migrations/V009__departure_pickup_options.sql:/docker-entrypoint-initdb.d/09_pickup_options.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_tour -Dsgu_tour -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='tour'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-pricing:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PRICING_PASSWORD:?MYSQL_ROOT_PRICING_PASSWORD is required}
      MYSQL_DATABASE: sgu_pricing
      MYSQL_USER: sgu_pricing
      MYSQL_PASSWORD: ${MYSQL_PRICING_PASSWORD:?MYSQL_PRICING_PASSWORD is required}
    volumes:
      - mysql_pricing_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_pricing.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_pricing -Dsgu_pricing -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='prices'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-booking:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=80", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_BOOKING_PASSWORD:?MYSQL_ROOT_BOOKING_PASSWORD is required}
      MYSQL_DATABASE: sgu_booking
      MYSQL_USER: sgu_booking
      MYSQL_PASSWORD: ${MYSQL_BOOKING_PASSWORD:?MYSQL_BOOKING_PASSWORD is required}
    volumes:
      - mysql_booking_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_booking.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data_seed/migrations/V007__booking_departure_operations.sql:/docker-entrypoint-initdb.d/07_departure_operations.sql:ro
      - ./data_seed/migrations/V008__departure_guide_assignment.sql:/docker-entrypoint-initdb.d/08_guide_assignment.sql:ro
      - ./data_seed/migrations/V012__guide_trip_workflow.sql:/docker-entrypoint-initdb.d/12_guide_trip_workflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_booking -Dsgu_booking -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='booking'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-payment:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PAYMENT_PASSWORD:?MYSQL_ROOT_PAYMENT_PASSWORD is required}
      MYSQL_DATABASE: sgu_payment
      MYSQL_USER: sgu_payment
      MYSQL_PASSWORD: ${MYSQL_PAYMENT_PASSWORD:?MYSQL_PAYMENT_PASSWORD is required}
    volumes:
      - mysql_payment_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_payment.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_payment -Dsgu_payment -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='payment'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-invoice:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_INVOICE_PASSWORD:?MYSQL_ROOT_INVOICE_PASSWORD is required}
      MYSQL_DATABASE: sgu_invoice
      MYSQL_USER: sgu_invoice
      MYSQL_PASSWORD: ${MYSQL_INVOICE_PASSWORD:?MYSQL_INVOICE_PASSWORD is required}
    volumes:
      - mysql_invoice_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_invoice.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_invoice -Dsgu_invoice -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='invoice'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-file:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_FILE_PASSWORD:?MYSQL_ROOT_FILE_PASSWORD is required}
      MYSQL_DATABASE: sgu_file
      MYSQL_USER: sgu_file
      MYSQL_PASSWORD: ${MYSQL_FILE_PASSWORD:?MYSQL_FILE_PASSWORD is required}
    volumes:
      - mysql_file_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_file.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_file -Dsgu_file -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='file_mgmt'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-notification:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_NOTIFICATION_PASSWORD:?MYSQL_ROOT_NOTIFICATION_PASSWORD is required}
      MYSQL_DATABASE: sgu_notification
      MYSQL_USER: sgu_notification
      MYSQL_PASSWORD: ${MYSQL_NOTIFICATION_PASSWORD:?MYSQL_NOTIFICATION_PASSWORD is required}
    volumes:
      - mysql_notification_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_notification.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_notification -Dsgu_notification -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='mail_outbox'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  mysql-reporting:
    <<: *service-common
    image: mysql:8.4
    command: ["--max-connections=50", "--innodb-buffer-pool-size=48M"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_REPORTING_PASSWORD:?MYSQL_ROOT_REPORTING_PASSWORD is required}
      MYSQL_DATABASE: sgu_reporting
      MYSQL_USER: sgu_reporting
      MYSQL_PASSWORD: ${MYSQL_REPORTING_PASSWORD:?MYSQL_REPORTING_PASSWORD is required}
    volumes:
      - mysql_reporting_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_reporting.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_reporting -Dsgu_reporting -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='operation_audit'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # 12 SPRING BOOT MICROSERVICES
  # ============================================================
  auth-service:
    <<: *service-common
    build: ./auth_service
    depends_on:
      mysql-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-auth:3306/sgu_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_auth
      SPRING_DATASOURCE_USERNAME: sgu_auth
      DB_PASSWORD: ${MYSQL_AUTH_PASSWORD:?MYSQL_AUTH_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      BOOKING_INTERNAL_KEY: ${BOOKING_INTERNAL_KEY:?BOOKING_INTERNAL_KEY is required}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY is required}
      INVOICE_INTERNAL_KEY: ${INVOICE_INTERNAL_KEY:?INVOICE_INTERNAL_KEY is required}
      TOUR_INTERNAL_KEY: ${TOUR_INTERNAL_KEY:?TOUR_INTERNAL_KEY is required}
      FILE_INTERNAL_KEY: ${FILE_INTERNAL_KEY:?FILE_INTERNAL_KEY is required}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY is required}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:?CATALOG_INTERNAL_KEY is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
      APP_SERVICES_BOOKING_BASE_URL: http://booking-service:8081/booking
      APP_SERVICES_PAYMENT_BASE_URL: http://payment-service:8083/payment
      APP_SERVICES_INVOICE_BASE_URL: http://invoice-service:8090/invoice
      APP_SERVICES_TOUR_BASE_URL: http://tour-service:8086/tour
      APP_SERVICES_FILE_BASE_URL: http://file-service:8087
      APP_SERVICES_NOTIFICATION_BASE_URL: http://notification-service:8093/notification
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  tour-service:
    <<: *service-common
    build: ./tour_service
    depends_on:
      mysql-tour:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_BOOKING_SALES_CUTOFF: ${BOOKING_SALES_CUTOFF:-PT4H}
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-tour:3306/sgu_tour?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_tour
      SPRING_DATASOURCE_USERNAME: sgu_tour
      DB_PASSWORD: ${MYSQL_TOUR_PASSWORD:?MYSQL_TOUR_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      TOUR_INTERNAL_KEY: ${TOUR_INTERNAL_KEY:?TOUR_INTERNAL_KEY is required}
      PRICING_INTERNAL_KEY: ${PRICING_INTERNAL_KEY:?PRICING_INTERNAL_KEY is required}
      FILE_INTERNAL_KEY: ${FILE_INTERNAL_KEY:?FILE_INTERNAL_KEY is required}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:?CATALOG_INTERNAL_KEY is required}
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_PRICING_BASE_URL: http://pricing-service:8084/pricing
      APP_SERVICES_FILE_BASE_URL: http://file-service:8087
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8086"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  pricing-service:
    <<: *service-common
    build: ./pricing_service
    depends_on:
      mysql-pricing:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-pricing:3306/sgu_pricing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_pricing
      SPRING_DATASOURCE_USERNAME: sgu_pricing
      DB_PASSWORD: ${MYSQL_PRICING_PASSWORD:?MYSQL_PRICING_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      PRICING_INTERNAL_KEY: ${PRICING_INTERNAL_KEY:?PRICING_INTERNAL_KEY is required}
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8084"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  booking-service:
    <<: *service-common
    build: ./booking_service
    depends_on:
      mysql-booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_BOOKING_SALES_CUTOFF: ${BOOKING_SALES_CUTOFF:-PT4H}
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-booking:3306/sgu_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_booking
      SPRING_DATASOURCE_USERNAME: sgu_booking
      DB_PASSWORD: ${MYSQL_BOOKING_PASSWORD:?MYSQL_BOOKING_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      BOOKING_INTERNAL_KEY: ${BOOKING_INTERNAL_KEY:?BOOKING_INTERNAL_KEY is required}
      TOUR_INTERNAL_KEY: ${TOUR_INTERNAL_KEY:?TOUR_INTERNAL_KEY is required}
      PRICING_INTERNAL_KEY: ${PRICING_INTERNAL_KEY:?PRICING_INTERNAL_KEY is required}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY is required}
      INVOICE_INTERNAL_KEY: ${INVOICE_INTERNAL_KEY:?INVOICE_INTERNAL_KEY is required}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY is required}
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:?MAIL_INTERNAL_API_KEY is required}
      REPORTING_INTERNAL_KEY: ${REPORTING_INTERNAL_KEY:?REPORTING_INTERNAL_KEY is required}
      REPORTING_ENABLED: "true"
      REPORTING_BASE_URL: http://reporting-service:8092/reporting
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_TOUR_BASE_URL: http://tour-service:8086/tour
      APP_SERVICES_PRICING_BASE_URL: http://pricing-service:8084/pricing
      APP_SERVICES_PAYMENT_BASE_URL: http://payment-service:8083/payment
      APP_SERVICES_INVOICE_BASE_URL: http://invoice-service:8090/invoice
      APP_SERVICES_NOTIFICATION_BASE_URL: http://notification-service:8093/notification
      MAIL_FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_TEST_MODE: ${MAIL_TEST_MODE:-true}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-no-reply@sgu-tour.example}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgu-tour.example}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  payment-service:
    <<: *service-common
    build: ./payment_service
    depends_on:
      mysql-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_BOOKING_SALES_CUTOFF: ${BOOKING_SALES_CUTOFF:-PT4H}
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-payment:3306/sgu_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_payment
      SPRING_DATASOURCE_USERNAME: sgu_payment
      DB_PASSWORD: ${MYSQL_PAYMENT_PASSWORD:?MYSQL_PAYMENT_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      PAYMENT_INTERNAL_KEY: ${PAYMENT_INTERNAL_KEY:?PAYMENT_INTERNAL_KEY is required}
      BOOKING_INTERNAL_KEY: ${BOOKING_INTERNAL_KEY:?BOOKING_INTERNAL_KEY is required}
      TOUR_INTERNAL_KEY: ${TOUR_INTERNAL_KEY:?TOUR_INTERNAL_KEY is required}
      PRICING_INTERNAL_KEY: ${PRICING_INTERNAL_KEY:?PRICING_INTERNAL_KEY is required}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY is required}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-SANDBOXTMN}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET is required}
      VNPAY_RETURN_URL: ${PUBLIC_BASE_URL:-http://localhost}/payment/vnpay/callback
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOSANDBOX}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-sandbox_access}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-sandbox_secret}
      MOMO_RETURN_URL: ${PUBLIC_BASE_URL:-http://localhost}/payment/momo/callback
      AUTH_SERVICE_BASE_URL: http://auth-service:8080/auth
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_BOOKING_BASE_URL: http://booking-service:8081/booking
      APP_SERVICES_TOUR_BASE_URL: http://tour-service:8086/tour
      APP_SERVICES_PRICING_BASE_URL: http://pricing-service:8084/pricing
      APP_SERVICES_NOTIFICATION_BASE_URL: http://notification-service:8093/notification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8083"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  invoice-service:
    <<: *service-common
    build: ./invoice_service
    depends_on:
      mysql-invoice:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-invoice:3306/sgu_invoice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_invoice
      SPRING_DATASOURCE_USERNAME: sgu_invoice
      DB_PASSWORD: ${MYSQL_INVOICE_PASSWORD:?MYSQL_INVOICE_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      INVOICE_INTERNAL_KEY: ${INVOICE_INTERNAL_KEY:?INVOICE_INTERNAL_KEY is required}
      BOOKING_INTERNAL_KEY: ${BOOKING_INTERNAL_KEY:?BOOKING_INTERNAL_KEY is required}
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      APP_SERVICES_BOOKING_BASE_URL: http://booking-service:8081/booking
      TOUR_BASE_URL: http://tour-service:8086/tour
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  file-service:
    <<: *service-common
    build: ./file_service
    depends_on:
      mysql-file:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-file:3306/sgu_file?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_file
      SPRING_DATASOURCE_USERNAME: sgu_file
      DB_PASSWORD: ${MYSQL_FILE_PASSWORD:?MYSQL_FILE_PASSWORD is required}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      FILE_INTERNAL_KEY: ${FILE_INTERNAL_KEY:?FILE_INTERNAL_KEY is required}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080/auth
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-sandbox-cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-sandbox-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-sandbox-secret}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8087"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  notification-service:
    <<: *service-common
    build: ./notification_service
    depends_on:
      mysql-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-notification:3306/sgu_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_notification
      SPRING_DATASOURCE_USERNAME: sgu_notification
      DB_PASSWORD: ${MYSQL_NOTIFICATION_PASSWORD:?MYSQL_NOTIFICATION_PASSWORD is required}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY is required}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_TEST_MODE: ${MAIL_TEST_MODE:-true}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-no-reply@sgu-tour.example}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgu-tour.example}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8093"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  reporting-service:
    <<: *service-common
    build: ./reporting_service
    depends_on:
      mysql-reporting:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      DB_URL: jdbc:mysql://mysql-reporting:3306/sgu_reporting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_reporting
      SPRING_DATASOURCE_USERNAME: sgu_reporting
      DB_PASSWORD: ${MYSQL_REPORTING_PASSWORD:?MYSQL_REPORTING_PASSWORD is required}
      REPORTING_INTERNAL_KEY: ${REPORTING_INTERNAL_KEY:?REPORTING_INTERNAL_KEY is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8092"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  search-service:
    <<: *service-common
    build: ./search_service
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      AUTH_INTROSPECT_URL: http://auth-service:8080/auth/users/introspect
      SEARCH_SOURCE_KEY: ${CATALOG_INTERNAL_KEY:?CATALOG_INTERNAL_KEY is required}
      APP_SEARCH_SOURCE_URL: http://tour-service:8086/tour/tours/search-snapshot
      ES_URIS: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8089"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  ai-service:
    <<: *service-common
    build: ./ai_service
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      SERVER_ADDRESS: 0.0.0.0
      AI_ENABLED: ${AI_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_CATALOG_BASE_URL: http://api_gateway:8888/api/v1/tour
      AI_BOOKING_BASE_URL: http://booking-service:8081/booking
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8091"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  api_gateway:
    <<: *service-common
    build: ./api_gateway
    depends_on:
      auth-service:
        condition: service_healthy
      tour-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    environment:
      JAVA_XMX: ${JAVA_XMX:-}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:?MAIL_INTERNAL_API_KEY is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      AUTH_BASE_URL: http://auth-service:8080
      BOOKING_BASE_URL: http://booking-service:8081
      PAYMENT_BASE_URL: http://payment-service:8083
      PRICING_BASE_URL: http://pricing-service:8084
      TOUR_BASE_URL: http://tour-service:8086
      FILE_BASE_URL: http://file-service:8087
      INVOICE_BASE_URL: http://invoice-service:8090
      SEARCH_BASE_URL: http://search-service:8089
      AI_BASE_URL: http://ai-service:8091
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173}
    ports:
      - "0.0.0.0:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    <<: *service-common
    build:
      context: ../Frontend_TourDuLich
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      api_gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  n8n:
    <<: *service-common
    profiles: ["mail"]
    image: n8nio/n8n:1.123.97
    environment:
      N8N_HOST: 127.0.0.1
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SGU_GATEWAY_URL: http://api_gateway:8888
      N8N_SGU_BOOKING_URL: http://booking-service:8081
      N8N_SGU_AUTH_URL: http://auth-service:8099
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  rabbitmq_data:
  mysql_auth_data:
  mysql_tour_data:
  mysql_pricing_data:
  mysql_booking_data:
  mysql_payment_data:
  mysql_invoice_data:
  mysql_file_data:
  mysql_notification_data:
  mysql_reporting_data:
  elasticsearch_data:
  redis_data:
  n8n_data:

networks:
  sgu-network:
    driver: bridge
