  redis:
    image: redis:7.2-alpine
    container_name: sgu_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgu-network
    deploy:
      resources:
        limits:
          memory: 288M

# ============================================================
# VOLUMES
# ============================================================
