# Phase 1 — Microservice Docker Compose

services:
  # Prepare the persistent directory with the RabbitMQ image UID before startup.
  # The marker prevents image copy-up from restoring a root-owned Erlang cookie.
  rabbitmq-volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-ec", "if [ ! -e /var/lib/rabbitmq/.volume-initialized ]; then chown -R 100:101 /var/lib/rabbitmq; touch /var/lib/rabbitmq/.volume-initialized; chown 100:101 /var/lib/rabbitmq/.volume-initialized; fi"]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: "no"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE

  # ============================================================
  # MESSAGE BROKER
  # ============================================================
  rabbitmq:
    depends_on:
      rabbitmq-volume-init:
        condition: service_completed_successfully
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sgu_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: sgu_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgu-network

  # ============================================================
  # 9 DATABASES VẬT LÝ ĐỘC LẬP
  # Mỗi DB: container riêng, volume riêng, user/grant riêng
  # ============================================================

  # 1. sgu_auth
  mysql-auth:
    image: mysql:8.4
    command:
      - "--max-connections=80"
      - "--innodb-buffer-pool-size=48M"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_AUTH_PASSWORD:?MYSQL_ROOT_AUTH_PASSWORD is required}
      MYSQL_DATABASE: sgu_auth
      MYSQL_USER: sgu_auth
      MYSQL_PASSWORD: ${MYSQL_AUTH_PASSWORD:?MYSQL_AUTH_PASSWORD is required}
    volumes:
      - mysql_auth_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_auth.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -usgu_auth -Dsgu_auth -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='users'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgu-network
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. sgu_tour
  mysql-tour:
