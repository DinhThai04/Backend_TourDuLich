      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-sandbox-key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-sandbox-secret}
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    networks:
      - sgu-network

  notification-service:
    build: ./notification_service
    depends_on:
      mysql-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-notification:3306/sgu_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_notification
      DB_PASSWORD: ${MYSQL_NOTIFICATION_PASSWORD:?MYSQL_NOTIFICATION_PASSWORD is required}
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?NOTIFICATION_INTERNAL_KEY is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    networks:
      - sgu-network

  reporting-service:
    build: ./reporting_service
    depends_on:
      mysql-reporting:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-reporting:3306/sgu_reporting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: sgu_reporting
      DB_PASSWORD: ${MYSQL_REPORTING_PASSWORD:?MYSQL_REPORTING_PASSWORD is required}
      REPORTING_INTERNAL_KEY: ${REPORTING_INTERNAL_KEY:?REPORTING_INTERNAL_KEY is required}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    networks:
      - sgu-network

  search-service:
    build: ./search_service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
      APP_AUTH_BASE_URL: http://auth-service:8080/auth
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: sgu_user
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      SPRING_RABBITMQ_VIRTUAL_HOST: sgu_vhost
    networks:
      - sgu-network

  ai-service:
    build: ./ai_service
    environment:
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:?AUTH_INTERNAL_KEY is required}
    networks:
      - sgu-network

  api_gateway:
    build: ./api_gateway
    depends_on:
      - auth-service
      - tour-service
      - pricing-service
      - booking-service
      - payment-service
      - invoice-service
      - file-service
      - search-service
      - ai-service
    environment:
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:?MAIL_INTERNAL_API_KEY is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - sgu-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  rabbitmq_data:
  mysql_auth_data:
  mysql_tour_data:
  mysql_pricing_data:
  mysql_booking_data:
  mysql_payment_data:
  mysql_invoice_data:
  mysql_file_data:
  mysql_notification_data:
  mysql_reporting_data:
  # elasticsearch_data:
  redis_data:

# ============================================================
# NETWORK
# ============================================================
networks:
  sgu-network:
    driver: bridge
