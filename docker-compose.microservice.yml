# Phase 1 — Microservice Docker Compose

services:
  # ============================================================
  # MESSAGE BROKER
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sgu_rabbitmq
    hostname: sgu-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: sgu_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sgu_rabbitmq_pass}
      RABBITMQ_DEFAULT_VHOST: sgu_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgu-network

  # ============================================================
  # 9 DATABASES VẬT LÝ ĐỘC LẬP
  # Mỗi DB: container riêng, volume riêng, user/grant riêng
  # ============================================================

  # 1. sgu_auth
  mysql-auth:
    image: mysql:8.4
    container_name: sgu_mysql_auth
    command:
      - "--max-connections=80"
      - "--innodb-buffer-pool-size=48M"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: sgu_auth
      MYSQL_USER: sgu_auth
      MYSQL_PASSWORD: ${MYSQL_AUTH_PASSWORD:-auth_pass}
    volumes:
      - mysql_auth_data:/var/lib/mysql
      - ./data_seed/microservices/sgu_auth.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sgu_auth", "-p${MYSQL_AUTH_PASSWORD:-auth_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sgu-network
    deploy:
      resources:
        limits:
          memory: 384M

