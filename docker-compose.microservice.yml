  rabbitmq_data:
  mysql_auth_data:
  mysql_tour_data:
  mysql_pricing_data:
  mysql_booking_data:
  mysql_payment_data:
  mysql_invoice_data:
  mysql_file_data:
  mysql_notification_data:
  mysql_reporting_data:
  # elasticsearch_data:
  redis_data:

# ============================================================
# NETWORK
# ============================================================
networks:
  sgu-network:
    driver: bridge
    name: sgu-network