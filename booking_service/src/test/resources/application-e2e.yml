# E2E Test Configuration
# Run with: docker compose up -d && mvn test -Dtest=FullBookingFlowE2ETest -Dspring.profiles.active=e2e

server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true

jwt:
  signerKey: test-signing-key-for-e2e-tests-only-32chars
  valid-duration: 3600
  refreshable-duration: 72000

app:
  booking:
    internal:
      internal-key: test-internal-key
  services:
    payment-base-url: http://localhost:8083/payment
    notification-base-url: http://localhost:8093/notification
    pricing-base-url: http://localhost:8084/pricing
    tour-base-url: http://localhost:8086/tour
  mail:
    enabled: false
    test-mode: true