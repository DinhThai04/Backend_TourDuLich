jwt:
  signerKey: ${JWT_SIGNER_KEY}

# Phase B: sending is OFF until explicitly enabled after migration/configuration.
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    internal-api-key: ${MAIL_INTERNAL_API_KEY:}
    test-mode: ${MAIL_TEST_MODE:true}
    test-recipient: ${MAIL_TEST_RECIPIENT:no-reply@sgu-tour.example}
    from: ${MAIL_FROM:no-reply@sgu-tour.example}
    brand: ${MAIL_BRAND:SGU Tour}
    frontend-base-url: ${MAIL_FRONTEND_BASE_URL:http://localhost:5173}
    batch-size: ${MAIL_BATCH_SIZE:10}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    lease: 2m
    # Each poll drains up to batch-size messages; a backlog above that is rate-limited by this tick.
    poll-delay-ms: ${MAIL_POLL_DELAY_MS:5000}
