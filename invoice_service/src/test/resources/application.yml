spring:
  datasource:
    url: "jdbc:h2:mem:invoice_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

jwt:
  signerKey: "invoice-test-signer-key-0123456789abcdef"
