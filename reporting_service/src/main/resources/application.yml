server:
  port: 8092
  servlet:
    context-path: /reporting

spring:
  config:
    import: "optional:file:./.local/reporting_service.properties,optional:file:../.local/reporting_service.properties"
  application:
    name: reporting-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3318/sgu_reporting}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    username: sgu_reporting
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: ${DB_POOL_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

app:
  reporting:
    internal-key: ${REPORTING_INTERNAL_KEY}