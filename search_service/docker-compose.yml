# Stack tìm kiếm chạy riêng cho dev và cho bước kiểm tra CI
# (`docker compose -f search_service/docker-compose.yml config -q`).
# Giữ đồng bộ với docker-compose.yml ở gốc repo backend; Kibana cố tình
# không đưa vào để tránh tốn thêm ~1 GB RAM trên máy dev.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      # Local development only: never expose search data to the network.
      - "127.0.0.1:9200:9200"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  es_data:
