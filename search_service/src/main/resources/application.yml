server:
  port: 8089
  servlet:
    context-path: /search

spring:
  config:
    import: "optional:file:./.local/search_service.properties,optional:file:../.local/search_service.properties,optional:file:./Backend_TourDuLich/.local/search_service.properties"
  application:
    name: search-service
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000
      database: 0
      client-type: lettuce

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  auth:
    # Search has no database connection; protected writes ask auth whether the token was revoked.
    introspect-url: ${AUTH_INTROSPECT_URL:http://localhost:8080/auth/users/introspect}
  search:
    # Each pass reads the whole catalogue over HTTP and verifies the ES index, so a weak machine can
    # raise SEARCH_SYNC_DELAY_MS (e.g. 300000); POST /search/tours/sync still forces an immediate refresh.
    sync-initial-delay-ms: ${SEARCH_SYNC_INITIAL_DELAY_MS:2000}
    sync-delay-ms: ${SEARCH_SYNC_DELAY_MS:60000}
    # Must match tour_service app.catalog.internal-key when the snapshot is not loopback.
    source-key: ${SEARCH_SOURCE_KEY:}
