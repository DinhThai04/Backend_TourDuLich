# Chạy toàn bộ hệ thống, tại thư mục Backend_TourDuLich (frontend là repo anh em
# ../Frontend_TourDuLich nên cần checkout cả hai cạnh nhau):
#   docker compose up -d --build
# Kèm tìm kiếm (Elasticsearch + Redis + search_service):
#   export CATALOG_INTERNAL_KEY=<chuỗi ≥32 ký tự>   # cùng key cho tour/auth/search
#   docker compose --profile search up -d --build
# Kèm trợ lý AI:
#   docker compose --profile ai up -d --build
# Kèm n8n cho workflow mail (gọi backend bằng tên service trong mạng compose):
#   docker compose --profile mail up -d n8n
#
# MySQL chạy ngoài Docker (XAMPP) trên máy host. Các biến bí mật
# (DB_PASSWORD, JWT_SIGNER_KEY, VNPAY_HASH_SECRET, CLOUDINARY_*) được đọc từ
# .local/*.properties của repo backend, gắn vào /app/.local của từng container,
# nên file này không chứa bí mật.
name: sgu-tour

x-backend: &backend
  restart: unless-stopped
  # Give in-flight mail/settlement work time to finish instead of a SIGKILL on `down`.
  stop_grace_period: 30s
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-health: &health
  interval: 15s
  timeout: 5s
  retries: 12
  start_period: 90s

x-db-env: &db-env
  DB_URL: ${DB_URL:-jdbc:mysql://host.docker.internal:3306/dbtour_v2}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  DB_POOL_MIN: ${DB_POOL_MIN:-2}
  DB_POOL_TIMEOUT_MS: ${DB_POOL_TIMEOUT_MS:-10000}

x-java-env: &java-env
  # Một biến duy nhất cho mọi container Java. Heap mặc định nằm trong Dockerfile:
  # gateway/payment/pricing/invoice 256m, booking 320m, auth/tour/file/search/AI 384m
  # (khoảng 3,2 GB cho cả stack, vừa máy dev 8 GB). Để trống giữ mặc định;
  # máy nhiều RAM đặt JAVA_XMX=512m hoặc 1g nhưng phải chừa RAM cho OS/MySQL.
  JAVA_XMX: ${JAVA_XMX:-}

services:
  auth_service:
    <<: *backend
    build: ./auth_service
    image: sgu-tour/auth-service
    environment:
      <<: [*db-env, *java-env]
      APP_SERVICES_FILE_BASE_URL: http://file_service:8087
      APP_SERVICES_TOUR_BASE_URL: http://tour_service:8086/tour
      APP_SERVICES_BOOKING_BASE_URL: http://booking_service:8081/booking
      # Bulk catalogue feed is internal; must equal tour_service CATALOG_INTERNAL_KEY.
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:-}
      # Phải trùng client id mà frontend dùng lúc build, nếu không Google trả token
      # cho audience khác và bước verify sẽ từ chối.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1079158114391-reid5167l6roke0h5grjelgqaivohlcq.apps.googleusercontent.com}
    volumes:
      - ./.local:/app/.local:ro
    ports:
      # Socket.IO dùng chung cổng với auth_service; nginx proxy nội bộ khi chạy Docker.
      # Chỉ bind loopback vì 8099 là cổng phụ bỏ qua gateway; mở ra LAN sẽ né được
      # rate-limit/CORS của gateway. Trong compose nginx vẫn gọi auth_service:8099.
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      <<: *health

  booking_service:
    <<: *backend
    build: ./booking_service
    image: sgu-tour/booking-service
    environment:
      <<: [*db-env, *java-env]
      MAIL_FRONTEND_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      MAIL_POLL_DELAY_MS: ${MAIL_POLL_DELAY_MS:-5000}
      # Sending stays off unless exported explicitly; SMTP credentials belong in the host env,
      # never in this file. Without these keys the worker is skipped inside the container.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_TEST_MODE: ${MAIL_TEST_MODE:-true}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-no-reply@sgu-tour.example}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgu-tour.example}
      MAIL_BRAND: ${MAIL_BRAND:-SGU Tour}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_BATCH_SIZE: ${MAIL_BATCH_SIZE:-10}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-3}
      # The n8n dispatch endpoint rejects an empty key; export it before `docker compose --profile mail up`.
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:-}
    volumes:
      - ./.local:/app/.local:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      <<: *health

  payment_service:
    <<: *backend
    build: ./payment_service
    image: sgu-tour/payment-service
    environment:
      <<: [*db-env, *java-env]
      # VNPAY_HASH_SECRET và VNPAY_TMN_CODE đọc từ .local/payment_service.properties (mount bên dưới).
      # Không truyền qua environment: biến rỗng sẽ đè file .local và payment từ chối khởi động,
      # kéo theo gateway (depends_on payment healthy) không lên.
      # Nginx (cổng 80) phục vụ frontend và proxy /api; đặt PUBLIC_BASE_URL khi chạy trên tên miền thật.
      VNPAY_RETURN_URL: ${PUBLIC_BASE_URL:-http://localhost}/payment/vnpay/callback
      MOMO_RETURN_URL: ${PUBLIC_BASE_URL:-http://localhost}/payment/momo/callback
      # MoMo gọi IPN từ internet, phải là URL công khai qua gateway (đã StripPrefix /api/v1).
      MOMO_IPN_URL: ${PUBLIC_BASE_URL:-http://localhost}/api/v1/payment/momo/ipn
      # Credential MoMo cũng đọc từ .local/payment_service.properties. Không khai báo ở đây:
      # một biến rỗng trong environment sẽ đè file .local và làm MoMo báo "chưa cấu hình".
    volumes:
      - ./.local:/app/.local:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8083"]
      <<: *health

  pricing_service:
    <<: *backend
    build: ./pricing_service
    image: sgu-tour/pricing-service
    environment:
      <<: [*db-env, *java-env]
    volumes:
      - ./.local:/app/.local:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8084"]
      <<: *health

  tour_service:
    <<: *backend
    build: ./tour_service
    image: sgu-tour/tour-service
    environment:
      <<: [*db-env, *java-env]
      APP_SERVICES_FILE_BASE_URL: http://file_service:8087
      APP_SERVICES_PRICING_BASE_URL: http://pricing_service:8084/pricing
      APP_ADVICE_MEDIA_URL: http://file_service:8087/file
      APP_ADVICE_PRICING_URL: http://api_gateway:8888/api/v1/pricing
      TOUR_IMAGE_SNAPSHOT_FILE: /app/data/tour-images.json
      TOUR_IMAGE_REFRESH_INTERVAL_MS: ${TOUR_IMAGE_REFRESH_INTERVAL_MS:-300000}
      TOUR_RANDOM_TTL_MS: ${TOUR_RANDOM_TTL_MS:-0}
      # The catalogue snapshot endpoint requires this key (loopback only when blank).
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY:-}
    volumes:
      - ./.local:/app/.local:ro
      - tour_images:/app/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8086"]
      <<: *health

  file_service:
    <<: *backend
    build: ./file_service
    image: sgu-tour/file-service
    environment:
      <<: [*db-env, *java-env]
    volumes:
      - ./.local:/app/.local:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8087"]
      <<: *health

  invoice_service:
    <<: *backend
    build: ./invoice_service
    image: sgu-tour/invoice-service
    environment:
      <<: [*db-env, *java-env]
      TOUR_SERVICE_URL: http://tour_service:8086/tour
    volumes:
      - ./.local:/app/.local:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090"]
      <<: *health

  search_service:
    <<: *backend
    profiles: ["search"]
    build: ./search_service
    image: sgu-tour/search-service
    environment:
      <<: *java-env
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      APP_SEARCH_SOURCE_URL: http://tour_service:8086/tour/tours/search-snapshot
      SEARCH_SOURCE_KEY: ${CATALOG_INTERNAL_KEY:-}
      AUTH_INTROSPECT_URL: http://auth_service:8080/auth/users/introspect
      SEARCH_SYNC_DELAY_MS: ${SEARCH_SYNC_DELAY_MS:-60000}
    volumes:
      - ./.local:/app/.local:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8089"]
      <<: *health

  ai_service:
    <<: *backend
    profiles: ["ai"]
    build: ./ai_service
    image: sgu-tour/ai-service
    environment:
      <<: *java-env
      # Service mặc định chỉ nghe 127.0.0.1 (an toàn khi chạy máy cá nhân).
      SERVER_ADDRESS: 0.0.0.0
      AI_ENABLED: ${AI_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_CATALOG_BASE_URL: http://api_gateway:8888/api/v1/tour
      AI_BOOKING_BASE_URL: http://booking_service:8081/booking
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8091"]
      <<: *health

  api_gateway:
    <<: *backend
    build: ./api_gateway
    image: sgu-tour/api-gateway
    environment:
      <<: *java-env
      AUTH_BASE_URL: http://auth_service:8080
      BOOKING_SERVICE_URL: http://booking_service:8081
      PAYMENT_SERVICE_URL: http://payment_service:8083
      PRICING_SERVICE_URL: http://pricing_service:8084
      TOUR_SERVICE_URL: http://tour_service:8086
      FILE_SERVICE_URL: http://file_service:8087
      INVOICE_SERVICE_URL: http://invoice_service:8090
      SEARCH_SERVICE_URL: http://search_service:8089
      APP_AI_BASE_URL: http://ai_service:8091
      MAIL_INTERNAL_API_KEY: ${MAIL_INTERNAL_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      # Chỉ mở trên localhost: mọi traffic công khai phải đi qua nginx (frontend),
      # nhờ vậy rate-limit của gateway nhận được IP thật và không bị giả header.
      - "127.0.0.1:8888:8888"
    depends_on:
      auth_service:
        condition: service_healthy
      booking_service:
        condition: service_healthy
      payment_service:
        condition: service_healthy
      pricing_service:
        condition: service_healthy
      tour_service:
        condition: service_healthy
      file_service:
        condition: service_healthy
      invoice_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]
      <<: *health

  frontend:
    build:
      context: ../Frontend_TourDuLich
      args:
        # .env không vào build context; Vite chỉ thấy biến công khai này qua build arg.
        # Dùng chung GOOGLE_CLIENT_ID với auth_service để token Google luôn đúng audience.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1079158114391-reid5167l6roke0h5grjelgqaivohlcq.apps.googleusercontent.com}
    image: sgu-tour/frontend
    restart: unless-stopped
    logging: *logging
    ports:
      # Local-only, like the gateway: LAN exposure must be a deliberate deployment decision.
      - "127.0.0.1:80:80"
    depends_on:
      api_gateway:
        condition: service_healthy
      # nginx resolves auth_service at startup for the Socket.IO proxy_pass.
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      <<: *health
      start_period: 10s

  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    logging: *logging
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      # Chỉ mở trên localhost: dữ liệu tìm kiếm không được lộ ra mạng LAN.
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    profiles: ["search"]
    image: redis:7.2
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # n8n chỉ bật khi cần workflow mail. Nó dùng chung mạng mặc định của compose
  # (sgu-tour_default) với backend nên gọi thẳng api_gateway:8888, booking_service:8081,
  # auth_service:8099 thay vì localhost/host.docker.internal.
  n8n:
    profiles: ["mail"]
    image: n8nio/n8n:1.70.0
    restart: unless-stopped
    logging: *logging
    environment:
      # Editor chỉ truy cập qua loopback đã publish bên dưới.
      N8N_HOST: 127.0.0.1
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # HTTP local không có HTTPS, giữ false để đăng nhập editor qua 127.0.0.1.
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      # URL nội bộ theo tên service; workflow mẫu dùng đúng các giá trị này.
      N8N_SGU_GATEWAY_URL: http://api_gateway:8888
      N8N_SGU_BOOKING_URL: http://booking_service:8081
      N8N_SGU_AUTH_URL: http://auth_service:8099
    ports:
      # Editor và webhook chỉ mở trên loopback, không lộ ra LAN.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz || exit 1"]
      <<: *health
      start_period: 30s

volumes:
  es_data:
  tour_images:
  n8n_data:
