spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  datasource:
    url: "jdbc:h2:mem:notification_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  notification:
    internal-key: "0123456789abcdef0123456789abcdef"
  mail:
    enabled: false
    test-mode: false
    from: "no-reply@sgu-tour.example"
